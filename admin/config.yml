backend:
  name: github
  repo: jainayush2094-lgtm/amazza
  branch: main
  base_url: https://sveltia-cms-auth.jainayush2094.workers.dev

# Where photos you upload through the CMS are stored
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # 1) Site-wide text + hero film -------------------------------------------
  - name: settings
    label: "Site Settings"
    files:
      - name: site
        label: "Homepage & Brand"
        file: "data/site.json"
        fields:
          - { name: eyebrow,   label: "Hero eyebrow line", widget: string }
          - { name: tagline,   label: "Hero tagline",      widget: string }
          - { name: rotate,    label: "Rotating words",    widget: list, default: ["Basins","Faucets","Furniture","Accessories"] }
          - { name: heroVideo, label: "Hero film (mp4) — leave blank for the animated still", widget: file, required: false }
          - { name: heroPoster,label: "Hero film poster image (still fallback)", widget: image, required: false }
          - { name: philosophy,label: "Philosophy paragraph (wrap words in |bars| for italic)", widget: text }
          - { name: craftHeading, label: "Craft heading", widget: string }
          - { name: craftBody,    label: "Craft paragraph", widget: text }
          - { name: email,     label: "Contact email", widget: string }
          - { name: whatsapp,  label: "WhatsApp number (country code + number, no +)", widget: string }

  # 2) The six collections (homepage) ---------------------------------------
  - name: collections_data
    label: "Collections"
    files:
      - name: products
        label: "Collections (the six)"
        file: "data/products.json"
        fields:
          - name: items
            label: "Collections"
            widget: list
            summary: "{{fields.numeral}} — {{fields.name}}"
            fields:
              - { name: numeral,     label: "Numeral (I, II, III…)", widget: string }
              - { name: name,        label: "Name", widget: string }
              - { name: description, label: "Short description", widget: text }
              - { name: tone,        label: "Placeholder tone (used until a photo is added)", widget: select,
                  options: ["colore","forma","wave","mobili","rubinetti","complementi"] }
              - { name: image,       label: "Photo (square, ~1600×1600)", widget: image, required: false }
              - { name: link,        label: "Inner page link (e.g. colore.html) — leave blank to hide Discover", widget: string, required: false }

  # 3) The Spaces lookbook (homepage) ----------------------------------------
  - name: spaces_data
    label: "Spaces"
    files:
      - name: spaces
        label: "Spaces (lookbook)"
        file: "data/spaces.json"
        fields:
          - name: items
            label: "Scenes"
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: label, label: "Small label (e.g. Interior)", widget: string }
              - { name: name,  label: "Scene name", widget: string }
              - { name: size,  label: "Tile size", widget: select, options: ["tall","wide"] }
              - { name: tone,  label: "Placeholder tone", widget: select, options: ["suite","stonebrass","verde"] }
              - { name: image, label: "Photo", widget: image, required: false }

  # 4) COLORE — inner page products ------------------------------------------
  - name: colore_page
    label: "Colore Products"
    files:
      - name: colore
        label: "Colore — Coloured Basins"
        file: "data/colore.json"
        fields:
          - { name: title,    label: "Page title", widget: string }
          - { name: numeral,  label: "Numeral", widget: string }
          - { name: subtitle, label: "Subtitle", widget: string }
          - { name: intro,    label: "Intro paragraph", widget: text }
          - name: items
            label: "Products (add / remove / reorder freely)"
            widget: list
            summary: "{{fields.sku}} — {{fields.name}}"
            fields:
              - { name: name,        label: "Name", widget: string }
              - { name: sku,         label: "SKU code", widget: string }
              - { name: price,       label: "Price (numbers only, e.g. 6,500) — leave blank to hide", widget: string, required: false }
              - { name: finish,      label: "Finish", widget: select, options: ["Gloss","Matte"] }
              - { name: swatch,      label: "Colour swatch (hex, e.g. #8FB8A3) — used for placeholder until photos added", widget: string }
              - { name: description, label: "Poetic description", widget: text }
              - { name: dimensions,  label: "Dimensions (e.g. L 500 · W 395 · H 145 mm)", widget: string }
              - { name: material,    label: "Material", widget: string, default: "Fine Fire Clay" }
              - { name: mounting,    label: "Mounting", widget: string, default: "Table Mounted" }
              - { name: warranty,    label: "Warranty", widget: string, default: "10 Years Replacement" }
              - { name: features,    label: "Feature chips", widget: list, default: ["Easy to Clean","Smooth Surface","Easy to Install","Anti-Stain Glaze"] }
              - { name: images,      label: "Photos — first becomes the main card image", widget: image, multiple: true, required: false }

  # 5) FORMA — inner page products -------------------------------------------
  - name: forma_page
    label: "Forma Products"
    files:
      - name: forma
        label: "Forma — White Basins"
        file: "data/forma.json"
        fields:
          - { name: title,    label: "Page title", widget: string }
          - { name: numeral,  label: "Numeral", widget: string }
          - { name: subtitle, label: "Subtitle", widget: string }
          - { name: intro,    label: "Intro paragraph", widget: text }
          - name: items
            label: "Products (add / remove / reorder freely)"
            widget: list
            summary: "{{fields.sku}} — {{fields.name}}"
            fields:
              - { name: name,        label: "Name", widget: string }
              - { name: sku,         label: "SKU code", widget: string }
              - { name: price,       label: "Price (numbers only, e.g. 5,000) — leave blank to hide", widget: string, required: false }
              - { name: finish,      label: "Finish", widget: string, default: "Glossy White" }
              - { name: swatch,      label: "Swatch hex for placeholder basin (keep near-white)", widget: string, default: "#F3EFE6" }
              - { name: description, label: "Poetic description", widget: text }
              - { name: dimensions,  label: "Dimensions (e.g. L 650 · W 415 · H 140 mm)", widget: string }
              - { name: material,    label: "Material", widget: string, default: "Fine Fire Clay" }
              - { name: mounting,    label: "Mounting", widget: string, default: "Table Mounted" }
              - { name: warranty,    label: "Warranty", widget: string, default: "10 Years Replacement" }
              - { name: features,    label: "Feature chips", widget: list, default: ["Easy to Clean","Smooth Surface","Easy to Install","Anti-Stain Glaze"] }
              - { name: images,      label: "Photos — first becomes the main card image", widget: image, multiple: true, required: false }

  # 6) SIGNATURE WAVE — inner page products -----------------------------------
  - name: wave_page
    label: "Signature Wave Products"
    files:
      - name: wave
        label: "Signature Wave — Closets"
        file: "data/wave.json"
        fields:
          - { name: title,    label: "Page title", widget: string }
          - { name: numeral,  label: "Numeral", widget: string }
          - { name: subtitle, label: "Subtitle", widget: string }
          - { name: intro,    label: "Intro paragraph", widget: text }
          - name: items
            label: "Products (add / remove / reorder freely)"
            widget: list
            summary: "{{fields.sku}} — {{fields.name}}"
            fields:
              - { name: name,        label: "Name", widget: string }
              - { name: sku,         label: "SKU code", widget: string }
              - { name: type,        label: "Type", widget: select, options: ["One-Piece Closet","Wall-Hung Closet"] }
              - { name: price,       label: "Price (numbers only, e.g. 13,000) — leave blank to hide", widget: string, required: false }
              - { name: finish,      label: "Finish", widget: string, default: "Glossy White" }
              - { name: swatch,      label: "Swatch hex for placeholder (keep near-white)", widget: string, default: "#F3EFE6" }
              - { name: description, label: "Poetic description", widget: text }
              - { name: dimensions,  label: "Dimensions (e.g. L 690 · W 370 · H 780 mm)", widget: string }
              - { name: trap,        label: "Trap distance (e.g. S-Trap 225 mm) — leave blank to hide", widget: string, required: false }
              - { name: flush,       label: "Flush system (e.g. Washdown, 5D Siphonic) — leave blank to hide", widget: string, required: false }
              - { name: material,    label: "Material", widget: string, default: "Fine Fire Clay" }
              - { name: warranty,    label: "Warranty", widget: string, default: "10 Years Replacement" }
              - { name: features,    label: "Feature chips", widget: list, default: ["Smooth Surface","Soft-Close Cover","Stainless Glaze"] }
              - { name: images,      label: "Photos — first becomes the main card image", widget: image, multiple: true, required: false }

  # 7) MOBILI — inner page products --------------------------------------------
  - name: mobili_page
    label: "Mobili Products"
    files:
      - name: mobili
        label: "Mobili — Roman Reverie Vanities"
        file: "data/mobili.json"
        fields:
          - { name: title,    label: "Page title", widget: string }
          - { name: numeral,  label: "Numeral", widget: string }
          - { name: subtitle, label: "Subtitle", widget: string }
          - { name: intro,    label: "Intro paragraph", widget: text }
          - name: items
            label: "Products (add / remove / reorder freely)"
            widget: list
            summary: "{{fields.sku}} — {{fields.name}}"
            fields:
              - { name: name,        label: "Name", widget: string }
              - { name: sku,         label: "SKU code", widget: string }
              - { name: series,      label: "Series", widget: select, options: ["Louvre","Lustro","Essenza"] }
              - { name: price,       label: "Full set price (e.g. 17,000) — leave blank to hide", widget: string, required: false }
              - { name: cabinet,     label: "Vanity cabinet price — leave blank to hide row", widget: string, required: false }
              - { name: marble,      label: "Marble / counter price — leave blank to hide row", widget: string, required: false }
              - { name: basin,       label: "Tabletop basin price — leave blank to hide row", widget: string, required: false }
              - { name: finish,      label: "Finish (e.g. Fluted Griege)", widget: string }
              - { name: swatch,      label: "Swatch hex for placeholder (finish tone)", widget: string, default: "#C9B091" }
              - { name: description, label: "Poetic description", widget: text }
              - { name: size,        label: "Size (e.g. 24 × 18 in)", widget: string, default: "24 × 18 in" }
              - { name: mounting,    label: "Mounting", widget: string, default: "Floor" }
              - { name: material,    label: "Board / material", widget: string, default: "HDHMR Board" }
              - { name: features,    label: "Feature chips", widget: list, default: ["Rust-Free Fittings","HDHMR Board","Moisture Resistant","Easy to Clean"] }
              - { name: images,      label: "Photos — first becomes the main card image", widget: image, multiple: true, required: false }
