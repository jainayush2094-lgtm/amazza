<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signature Wave — Amazza</title>
<meta name="description" content="The Signature Wave collection by Amazza — one-piece and wall-hung closets engineered for silence. Le luxe silencieux.">
<meta property="og:title" content="Signature Wave — Amazza">
<meta property="og:description" content="One-piece and wall-hung closets engineered for silence.">
<meta property="og:type" content="website">
<link rel="icon" href="images/brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#C5A23E;--gold-soft:#D9BE6A;--gold-deep:#9A7E2C;
    --dark:#16140F;--dark-2:#1E1B14;
    --cream:#F5F1E8;--cream-2:#EAE3D4;
    --ink:#272320;--muted:#8A8275;--muted-d:#9b9281;
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'Montserrat',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.7;overflow-x:hidden}
  ::selection{background:var(--gold);color:var(--dark)}
  img{display:block;max-width:100%}
  body::after{content:"";position:fixed;inset:0;z-index:80;pointer-events:none;opacity:.045;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .reveal{opacity:0;transform:translateY(24px);transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1s cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1;transform:none}
  .eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:8.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
  .eyebrow .ln{width:20px;height:1px;background:rgba(197,162,62,.55)}

  /* ===== top bar (mobile-first) ===== */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;background:rgba(20,18,13,.72);backdrop-filter:blur(12px);border-bottom:1px solid rgba(197,162,62,.16)}
  .topbar .back{display:flex;align-items:center;gap:8px;color:#cfc7b4;text-decoration:none;font-size:9px;letter-spacing:.2em;text-transform:uppercase}
  .topbar .back svg{width:14px;height:14px}
  .topbar .brand{font-family:var(--serif);font-size:16px;letter-spacing:.3em;color:#fff;margin-left:.3em}
  .topbar .spacer{width:52px}
  @media(min-width:720px){.topbar{padding:16px 34px}.topbar .brand{font-size:18px}}

  /* ===== hero (compact) ===== */
  .chero{background:var(--dark);color:var(--cream);text-align:center;padding:104px 22px 54px;position:relative;overflow:hidden}
  .chero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(197,162,62,.12),transparent 60%);pointer-events:none}
  .chero .num{font-family:var(--serif);font-style:italic;font-size:30px;color:rgba(197,162,62,.55);line-height:1;margin-bottom:10px}
  .chero h1{font-family:var(--serif);font-weight:500;font-size:clamp(34px,9.5vw,80px);letter-spacing:.14em;line-height:.95;margin-left:.14em}
  .chero .sub{font-size:9.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-soft);margin-top:16px}
  .chero .intro{max-width:560px;margin:22px auto 0;font-size:12.5px;font-weight:300;color:#bdb6a6;letter-spacing:.02em;line-height:1.9}
  @media(min-width:720px){.chero{padding:130px 24px 70px}}

  /* ===== grid ===== */
  .cgrid{max-width:1180px;margin:0 auto;padding:44px 18px 70px;display:grid;grid-template-columns:1fr;gap:26px}
  @media(min-width:560px){.cgrid{grid-template-columns:1fr 1fr;gap:24px;padding:54px 24px 80px}}
  @media(min-width:960px){.cgrid{grid-template-columns:1fr 1fr 1fr;gap:30px}}

  .pcard{background:#fff;border:1px solid rgba(42,38,32,.07);overflow:hidden;cursor:pointer;transition:.4s ease;-webkit-tap-highlight-color:transparent}
  .pcard:active{transform:scale(.985)}
  @media(hover:hover){.pcard:hover{transform:translateY(-5px);box-shadow:0 22px 48px -28px rgba(42,38,32,.4)}}
  .pcard .ph{aspect-ratio:1/1;position:relative;overflow:hidden;background-size:cover;background-position:center;
    display:flex;align-items:center;justify-content:center}
  .pcard .ph .basin{width:58%;opacity:.92;filter:drop-shadow(0 14px 22px rgba(0,0,0,.25))}
  .pcard .ph .chip{position:absolute;top:12px;left:12px;font-size:8px;letter-spacing:.22em;text-transform:uppercase;
    background:rgba(23,21,15,.72);color:var(--gold-soft);padding:5px 9px}
  .pcard .body{padding:18px 18px 20px}
  .pcard .body .sku{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .pcard .body h3{font-family:var(--serif);font-weight:500;font-size:26px;letter-spacing:.02em;line-height:1.05;margin-top:4px}
  .pcard .body .row{display:flex;align-items:baseline;justify-content:space-between;margin-top:8px}
  .pcard .body .price{font-size:12px;letter-spacing:.06em;color:var(--gold-deep)}
  .pcard .body .price small{font-size:8.5px;color:var(--muted);letter-spacing:.12em}
  .pcard .body .view{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);border-bottom:1px solid var(--gold)}

  /* ===== detail sheet (mobile: bottom sheet · desktop: modal) ===== */
  .sheet-wrap{position:fixed;inset:0;z-index:200;display:none}
  .sheet-wrap.open{display:block}
  .sheet-wrap .veil{position:absolute;inset:0;background:rgba(12,10,7,.6);backdrop-filter:blur(4px);opacity:0;transition:.35s}
  .sheet-wrap.open .veil{opacity:1}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;background:var(--cream);overflow-y:auto;
    transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.7,.2,1);border-radius:14px 14px 0 0;-webkit-overflow-scrolling:touch}
  .sheet-wrap.open .sheet{transform:none}
  .sheet .grab{position:sticky;top:0;z-index:5;background:var(--cream);padding:10px 0 6px;display:flex;justify-content:center}
  .sheet .grab span{width:38px;height:4px;border-radius:2px;background:rgba(42,38,32,.2)}
  .sheet .close{position:absolute;top:12px;right:14px;z-index:6;width:32px;height:32px;border:1px solid rgba(42,38,32,.2);
    background:var(--cream);color:var(--ink);font-size:16px;line-height:1;cursor:pointer;border-radius:50%}
  @media(min-width:760px){
    .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-46%) scale(.96);opacity:0;
      width:min(880px,92vw);max-height:86vh;border-radius:4px;transition:.45s cubic-bezier(.2,.7,.2,1)}
    .sheet-wrap.open .sheet{transform:translate(-50%,-50%) scale(1);opacity:1}
    .sheet .grab{display:none}
  }
  .sheet .inner{display:grid;grid-template-columns:1fr}
  @media(min-width:760px){.sheet .inner{grid-template-columns:1.05fr 1fr}}
  /* gallery */
  .gal{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--cream-2)}
  .gal .slide{position:absolute;inset:0;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .5s}
  .gal .slide.on{opacity:1}
  .gal .slide .basin{width:60%;filter:drop-shadow(0 18px 28px rgba(0,0,0,.28))}
  .gal .dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:7px}
  .gal .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);cursor:pointer;transition:.3s}
  .gal .dots i.on{background:var(--gold-soft);transform:scale(1.3)}
  .gal .nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;
    border:1px solid rgba(255,255,255,.35);background:rgba(20,18,13,.35);color:#fff;font-size:15px;cursor:pointer;display:none}
  .gal:hover .nav{display:block}
  .gal .nav.prev{left:12px}.gal .nav.next{right:12px}
  /* details */
  .det{padding:24px 22px 34px}
  @media(min-width:760px){.det{padding:38px 36px;overflow-y:auto;max-height:86vh}}
  .det .sku{font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  .det h2{font-family:var(--serif);font-weight:500;font-size:clamp(32px,8vw,44px);letter-spacing:.02em;line-height:1;margin-top:6px}
  .det .fin{display:inline-block;margin-top:10px;font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-deep);
    border:1px solid rgba(154,126,44,.4);padding:5px 10px}
  .det .desc{font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.65;color:var(--ink);margin-top:16px}
  .det .price{margin-top:16px;font-size:20px;font-family:var(--serif);color:var(--ink)}
  .det .price small{font-size:9px;font-family:var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-left:8px}
  .det .specs{margin-top:20px;border-top:1px solid rgba(42,38,32,.12)}
  .det .specs .r{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid rgba(42,38,32,.12)}
  .det .specs .k{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding-top:2px}
  .det .specs .v{font-size:12px;text-align:right;letter-spacing:.02em}
  .det .feats{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;padding-bottom:8px}
  .det .feats span{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);
    background:var(--cream-2);padding:7px 11px}

  /* ===== footer (minimal) ===== */
  footer{background:var(--dark);color:var(--cream);text-align:center;padding:54px 22px 96px}
  footer .fb{font-family:var(--serif);font-size:24px;letter-spacing:.3em;margin-left:.3em}
  footer .ft{font-family:var(--serif);font-style:italic;color:var(--gold-soft);font-size:14px;margin-top:8px}
  footer a{display:inline-block;margin-top:20px;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-d);text-decoration:none}
  footer a:hover{color:var(--gold-soft)}
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 6l-6 6 6 6"/></svg>
    Home
  </a>
  <div class="brand">AMAZZA</div>
  <div class="spacer"></div>
</div>

<header class="chero">
  <div class="num" id="hNum">III</div>
  <h1 id="hTitle">SIGNATURE&nbsp;WAVE</h1>
  <div class="sub" id="hSub">One-Piece &amp; Wall-Hung Closets</div>
  <p class="intro" id="hIntro"></p>
</header>

<main class="cgrid" id="grid"></main>

<!-- detail sheet -->
<div class="sheet-wrap" id="sheetWrap" aria-hidden="true">
  <div class="veil" onclick="closeSheet()"></div>
  <div class="sheet">
    <div class="grab"><span></span></div>
    <button class="close" onclick="closeSheet()">&times;</button>
    <div class="inner">
      <div class="gal" id="gal"></div>
      <div class="det" id="det"></div>
    </div>
  </div>
</div>

<footer>
  <div class="fb">AMAZZA</div>
  <div class="ft">le luxe silencieux</div>
  <a href="index.html">Return to the House</a>
</footer>

<script>
  /* ---------- fallback data (used when data/colore.json can't be fetched, e.g. local preview) ---------- */
  const FALLBACK = {"title": "Signature Wave", "numeral": "III", "subtitle": "One-Piece & Wall-Hung Closets", "intro": "Engineered for silence, designed for beauty. The Signature Wave collection reimagines the closet as a quiet sculpture for the room — continuous curves and clean planes, never spectacle. Every model is finished in high-grade ceramic with a soft-close seat as standard. Individual flush systems, from washdown to 6D siphonic, are noted on each piece.", "items": [{"name": "Diamond", "sku": "AM-OP-WT01", "type": "One-Piece Closet", "price": "13,000", "finish": "Glossy White", "swatch": "#F3EFE6", "description": "Cut like a gemstone, its faceted planes turn light into architecture — the boldest statement in the Amazza collection.", "dimensions": "L 690 · W 370 · H 780 mm", "trap": "S-Trap 225 mm", "flush": "Washdown", "material": "Fine Fire Clay", "warranty": "10 Years Replacement", "features": ["Smooth Surface", "Washdown Flush", "Soft-Close Cover", "Stainless Glaze"], "images": []}, {"name": "Marco", "sku": "AM-OP-WT02", "type": "One-Piece Closet", "price": "13,000", "finish": "Glossy White", "swatch": "#F1EDE4", "description": "Soft continuous curves conceal serious engineering — rimless design and siphonic flush deliver silence beneath an effortlessly composed silhouette.", "dimensions": "L 645 · W 360 · H 735 mm", "trap": "S-Trap 225 / 300 mm", "flush": "5D Siphonic", "material": "Fine Fire Clay", "warranty": "10 Years Replacement", "features": ["Rimless Design", "5D Siphonic Flush", "Soft-Close Cover", "Stainless Glaze"], "images": []}, {"name": "Cabio", "sku": "AM-OP-WT03", "type": "One-Piece Closet", "price": "12,000", "finish": "Glossy White", "swatch": "#F4F0E8", "description": "Compact and quietly confident, Cabio's squared profile suits modern city bathrooms where every centimetre must earn its place.", "dimensions": "L 640 · W 360 · H 710 mm", "trap": "S-Trap 225 / 300 mm · P-Trap 180 mm", "flush": "Washdown", "material": "Fine Fire Clay", "warranty": "10 Years Replacement", "features": ["Smooth Surface", "Washdown Flush", "Soft-Close Cover", "Stainless Glaze"], "images": []}, {"name": "Marco 2.0", "sku": "AM-OP-WT04", "type": "One-Piece Closet", "price": "13,000", "finish": "Glossy White", "swatch": "#F2EEE5", "description": "The Marco refined further — a longer, lower stance with sculpted shoulders, drawn in one uninterrupted line from lid to floor.", "dimensions": "L 700 · W 365 · H 765 mm", "trap": "S-Trap 230 mm", "flush": "Washdown", "material": "Fine Fire Clay", "warranty": "10 Years Replacement", "features": ["Smooth Surface", "Washdown Flush", "Soft-Close Cover", "Stainless Glaze"], "images": []}, {"name": "Crenza", "sku": "AM-OP-WT05", "type": "One-Piece Closet", "price": "12,000", "finish": "Glossy White", "swatch": "#F3EFE7", "description": "A single flowing gesture from tank to base. Crenza pairs sculptural softness with the collection's most powerful 6D flush.", "dimensions": "L 655 · W 360 · H 760 mm", "trap": "S-Trap 230 / 300 mm", "flush": "6D Siphonic", "material": "Fine Fire Clay", "warranty": "10 Years Replacement", "features": ["Hi-Gloss Surface", "6D Siphonic Flush", "Soft-Close Cover", "Stainless Glaze"], "images": []}, {"name": "Lunar", "sku": "AM-OP-WT06", "type": "One-Piece Closet", "price": "12,000", "finish": "Glossy White", "swatch": "#F1EDE3", "description": "Named for its phases of curve and shadow, Lunar rises from a flared base with calm, lunar-white serenity.", "dimensions": "L 665 · W 370 · H 770 mm", "trap": "S-Trap 225 mm", "flush": "Washdown", "material": "Fine Fire Clay", "warranty": "10 Years Replacement", "features": ["Smooth Surface", "Washdown Flush", "Soft-Close Cover", "Stainless Glaze"], "images": []}, {"name": "Java", "sku": "AM-OP-WT07", "type": "One-Piece Closet", "price": "13,000", "finish": "Glossy White", "swatch": "#F4F0E9", "description": "Crisp edges and carved side panels give Java its tailored character — strength expressed through precision, never through weight.", "dimensions": "L 630 · W 350 · H 680 mm", "trap": "S-Trap 100 / 225 mm", "flush": "Washdown", "material": "Fine Fire Clay", "warranty": "10 Years Replacement", "features": ["Smooth Surface", "Washdown Flush", "Soft-Close Cover", "Stainless Glaze"], "images": []}, {"name": "Volvo", "sku": "AM-OP-WT08", "type": "One-Piece Closet", "price": "12,000", "finish": "Glossy White", "swatch": "#F2EEE6", "description": "Unapologetically architectural. Volvo's monolithic form and hi-gloss surface anchor the bath with quiet, engineered authority.", "dimensions": "L 645 · W 355 · H 740 mm", "trap": "S-Trap 225 mm", "flush": "5D Siphonic", "material": "Fine Fire Clay", "warranty": "10 Years Replacement", "features": ["Hi-Gloss Surface", "5D Siphonic Flush", "Soft-Close Cover", "Stainless Glaze"], "images": []}, {"name": "Croma", "sku": "AM-WH-WT01", "type": "Wall-Hung Closet", "price": "9,000", "finish": "Glossy White", "swatch": "#F3EFE8", "description": "Suspended in a single unbroken curve, Croma floats above the floor — pure geometry, effortless cleaning, visual lightness.", "dimensions": "510 × 380 × 370 mm", "trap": "", "flush": "", "material": "Fine Fire Clay", "warranty": "10 Years Replacement", "features": ["Smooth Surface", "Soft-Close Cover", "Stainless Glaze", "Easy to Install"], "images": []}, {"name": "Loft", "sku": "AM-WH-WT02", "type": "Wall-Hung Closet", "price": "9,000", "finish": "Glossy White", "swatch": "#F1EDE5", "description": "Sharp planes and a cantilevered stance give Loft its architectural edge — a wall-hung form drawn with a ruler.", "dimensions": "520 × 360 × 340 mm", "trap": "", "flush": "", "material": "Fine Fire Clay", "warranty": "10 Years Replacement", "features": ["Smooth Surface", "Soft-Close Cover", "Stainless Glaze", "Easy to Install"], "images": []}]};

  let DATA = null;

  function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

  /* elegant basin silhouette drawn per swatch colour (placeholder until photos are uploaded) */
  function basinSVG(color, dark){
    const stroke = dark ? 'rgba(255,255,255,.25)' : 'rgba(0,0,0,.12)';
    return `<svg class="basin" viewBox="0 0 200 170" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="118" y="12" width="58" height="74" rx="10" fill="${color}" stroke="${stroke}" stroke-width="1"/>
      <rect x="128" y="4" width="38" height="10" rx="4" fill="${color}" stroke="${stroke}" stroke-width="1"/>
      <path d="M118 62 L52 62 C34 62 24 76 24 92 C24 116 44 130 74 130 L136 130 L136 86" fill="${color}" stroke="${stroke}" stroke-width="1"/>
      <path d="M118 62 L52 62 C40 62 30 72 30 84 C30 74 44 68 60 68 L118 68 Z" fill="rgba(255,255,255,.28)"/>
      <path d="M78 130 L84 156 L128 156 L134 130 Z" fill="${color}" stroke="${stroke}" stroke-width="1"/>
      <ellipse cx="106" cy="160" rx="34" ry="4" fill="rgba(0,0,0,.10)"/>
    </svg>`;
  }
  function isDark(hex){
    const h = hex.replace('#',''); const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
    return (r*299+g*587+b*114)/1000 < 128;
  }
  function phBackground(sw){
    return `radial-gradient(ellipse at 50% 28%,rgba(255,255,255,.18),transparent 60%),linear-gradient(155deg,#E9E2D2,#DDD4C0 60%,#CFC5AD)`;
  }

  async function load(){
    try{
      DATA = await fetch('data/wave.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()});
    }catch(e){ DATA = FALLBACK; }
    render();
  }

  function render(){
    document.getElementById('hNum').textContent = DATA.numeral || '';
    document.getElementById('hTitle').textContent = (DATA.title||'').toUpperCase();
    document.getElementById('hSub').textContent = DATA.subtitle || '';
    document.getElementById('hIntro').textContent = DATA.intro || '';
    document.title = (DATA.title||'Collection') + ' — Amazza';

    // grid
    const g = document.getElementById('grid');
    g.innerHTML = DATA.items.map((p,i)=>{
      const hasImg = p.images && p.images.length;
      const ph = hasImg
        ? `style="background-image:url('${p.images[0]}')"`
        : `style="background:${phBackground(p.swatch)}"`;
      return `<div class="pcard reveal" onclick="openSheet(${i})">
        <div class="ph" ${ph}>
          <span class="chip">${esc(p.type||p.finish)}</span>
          ${hasImg ? '' : basinSVG(p.swatch, isDark(p.swatch))}
        </div>
        <div class="body">
          <div class="sku">${esc(p.sku)}</div>
          <h3>${esc(p.name)}</h3>
          <div class="row">
            <div class="price">₹ ${esc(p.price)} <small>MRP excl. GST</small></div>
            <div class="view">View</div>
          </div>
        </div>
      </div>`;
    }).join('');

    const io=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}})},{threshold:.1});
    document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
  }

  /* ---------- detail sheet ---------- */
  let galIdx = 0, galCount = 0;
  function openSheet(i){
    const p = DATA.items[i];
    const gal = document.getElementById('gal');
    const slides = (p.images && p.images.length)
      ? p.images.map((im,ix)=>`<div class="slide ${ix===0?'on':''}" style="background-image:url('${im}')"></div>`).join('')
      : `<div class="slide on" style="background:${phBackground(p.swatch)}">${basinSVG(p.swatch,isDark(p.swatch))}</div>`;
    galCount = (p.images && p.images.length) ? p.images.length : 1; galIdx = 0;
    gal.innerHTML = slides
      + (galCount>1 ? `<button class="nav prev" onclick="galGo(-1)">&#8249;</button><button class="nav next" onclick="galGo(1)">&#8250;</button>
         <div class="dots">${Array.from({length:galCount},(_,d)=>`<i class="${d===0?'on':''}" onclick="galTo(${d})"></i>`).join('')}</div>` : '');

    document.getElementById('det').innerHTML = `
      <div class="sku">${esc(p.sku)}</div>
      <h2>${esc(p.name)}</h2>
      <span class="fin">${esc(p.finish)} Finish</span>
      <p class="desc">${esc(p.description)}</p>
      <div class="price">₹ ${esc(p.price)}<small>MRP · Excl. GST</small></div>
      <div class="specs">
        <div class="r"><div class="k">Type</div><div class="v">${esc(p.type||'')}</div></div>
        <div class="r"><div class="k">Dimensions</div><div class="v">${esc(p.dimensions)}</div></div>${p.trap?`<div class="r"><div class="k">Trap</div><div class="v">${esc(p.trap)}</div></div>`:''}${p.flush?`<div class="r"><div class="k">Flush</div><div class="v">${esc(p.flush)} Flush</div></div>`:''}
        <div class="r"><div class="k">Material</div><div class="v">${esc(p.material)}</div></div>
        ${p.mounting?`<div class="r"><div class="k">Mounting</div><div class="v">${esc(p.mounting)}</div></div>`:''}
        <div class="r"><div class="k">Warranty</div><div class="v">${esc(p.warranty)}</div></div>
      </div>
      <div class="feats">${(p.features||[]).map(f=>`<span>${esc(f)}</span>`).join('')}</div>`;

    const w = document.getElementById('sheetWrap');
    w.classList.add('open'); w.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
    // swipe support
    let sx=null; gal.ontouchstart=e=>{sx=e.touches[0].clientX};
    gal.ontouchend=e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)galGo(dx<0?1:-1);sx=null;};
  }
  function closeSheet(){
    const w = document.getElementById('sheetWrap');
    w.classList.remove('open'); w.setAttribute('aria-hidden','true');
    document.body.style.overflow = '';
  }
  function galGo(d){ galTo((galIdx + d + galCount) % galCount); }
  function galTo(n){
    galIdx = n;
    document.querySelectorAll('#gal .slide').forEach((s,i)=>s.classList.toggle('on',i===n));
    document.querySelectorAll('#gal .dots i').forEach((s,i)=>s.classList.toggle('on',i===n));
  }
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});

  load();
</script>
</body>
</html>
